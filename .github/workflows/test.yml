name: test

# The required check contexts in ruleset 24626699 are literal strings, including
# the workflow and event labels. Explicit job names must match those contexts;
# GitHub's combined display labels do not change the names reported by each job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: test / offline (pull_request)
    runs-on: ubuntu-latest
    steps:
      # Catalog revision checks need the history of the published files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Validate code or the complete main tree
        env:
          # `all` 模式含三个发布门禁（manifest / release / catalog），它们校验的是
          # feed/manifest.json 与磁盘文件是否对齐。清单必须由发布者的私钥重签，
          # 而私钥只在发布者的机器与 CI secret 里，任何 fork 都拿不到；对 fork 的
          # 每一次 push 与手动触发都跑 all，等于让离线作业恒红，把真正的回归淹掉。
          #
          # 因此只有推到 main（本仓库的更新源，由发布者自己维护）才跑 all；
          # PR 与手动触发走 contributor —— 它仍会跑 catalog，只跳过「发布方私有」
          # 的 revision 与摘要对齐，adapter 隔离那条 Critical 门禁照常执行。
          TEST_MODE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'all' || 'contributor' }}
        run: node scripts/test-all.mjs --mode "$TEST_MODE"

  release-readiness:
    name: test / release-readiness (pull_request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run test:release

  # The adapter seam (and only it) is kept under strict TypeScript checking. This
  # job installs development dependencies without running lifecycle scripts.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck

  standalone-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/standalone --ignore-scripts
      - run: npm run typecheck:standalone
      - run: node scripts/build-standalone-ui.mjs --check
      - run: node scripts/build-legacy-payload.mjs --check
